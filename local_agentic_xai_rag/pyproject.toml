[project]
name = "local_agentic_xai_rag"
version = "0.1.0"
description = "Local CrewAI XAI-RAG advisory screening reports (Ollama llama3 only)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.7.4",
  "pydantic>=2.0.0",
  "openpyxl>=3.1.0",
  "jsonschema>=4.20.0",
  "matplotlib>=3.8.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.80.0", "crewai-tools>=0.14.0"]

[project.scripts]
local-xai-rag = "local_agentic_xai_rag.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
