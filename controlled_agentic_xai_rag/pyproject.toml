[project]
name = "controlled_agentic_xai_rag"
version = "0.1.0"
description = "Controlled local Agentic XAI-RAG for non-clinical screening narratives (Ollama llama3 only)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.7.4",
  "chromadb>=0.5.0",
  "pydantic>=2.0.0",
  "jsonschema>=4.20.0",
  "pypdf>=4.0.0",
  "cryptography>=3.1",
  "openpyxl>=3.1.0",
  "matplotlib>=3.8.0",
  "streamlit>=1.32.0",
  "scikit-learn>=1.7.2,<1.8",
  "joblib>=1.3.0",
  "catboost>=1.2.0",
  "shap>=0.44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
controlled-xai-rag = "controlled_agentic_xai_rag.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
